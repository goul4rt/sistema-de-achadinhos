[project]
name = "achadinhos"
version = "0.1.0"
description = "Caçador de promoções: coleta contínua, listas configuráveis e histórico de preço"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["achadinhos*"]

[tool.setuptools.package-data]
achadinhos = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
